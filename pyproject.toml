[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "bbagent"
version = "0.1.0"
description = "Building Block Agent — Stack Agents, Compose Teams. A self-contained agent framework with composable Agent, Team, Session, Tool, Hook, MCP and Skill building blocks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "LILG98" },
]
keywords = [
    "agent",
    "llm",
    "ai",
    "framework",
    "multi-agent",
    "team",
    "tool-use",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12",
]
memory = [
    "jieba>=0.42",
    "chromadb>=0.4.24",
    "rank-bm25>=0.2.2",
    "ollama>=0.1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]
all = [
    "bbagent[web,memory]",
]

[project.urls]
Homepage = "https://github.com/LILG98/BBagent"
Repository = "https://github.com/LILG98/BBagent"
Issues = "https://github.com/LILG98/BBagent/issues"
Documentation = "https://github.com/LILG98/BBagent#readme"

[project.scripts]
bbagent-server = "run:main"

[tool.hatch.build.targets.wheel]
packages = ["bbagent"]

[tool.hatch.build.targets.sdist]
include = [
    "bbagent",
    "backend",
    "run.py",
    "README.md",
    "LICENSE",
    "templates",
    "doc",
    "pyproject.toml",
]

[tool.hatch.version]
path = "bbagent/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "frontend",
    "dist",
    "build",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "ASYNC",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
mypy_path = "."
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = false
exclude = [
    "frontend",
    "dist",
    "build",
    ".venv",
    "venv",
    "tests",
]

[[tool.mypy.overrides]]
module = ["BBagent.built_in_hook.memory.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["bbagent", "backend"]
omit = [
    "bbagent/built_in_hook/memory/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]