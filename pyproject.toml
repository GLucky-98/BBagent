[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbagent"
version = "0.1.0"
description = "A lightweight agent framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx",
    "pyyaml",
    "ollama",
    "jieba",
    "chromadb",
    "rank_bm25",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
include = ["BBagent*"]

